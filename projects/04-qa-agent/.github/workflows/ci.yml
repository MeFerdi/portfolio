# Lives inside the project folder so it travels with the project when it is
# split into its own repository (GitHub only runs workflows from the repo root).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: typecheck + unit/contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    needs: unit
    env:
      CI: "true"
      GIT_SHA: ${{ github.sha }}
      # No diagnosis service in CI yet: the reporter spools events to test-results/undelivered.
      DIAGNOSIS_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
