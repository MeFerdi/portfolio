services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      # Local development only: passwordless auth, port bound to localhost below.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: qa_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qa_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
