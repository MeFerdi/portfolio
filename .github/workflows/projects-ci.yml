name: projects-ci

on:
  push:
    paths: ['projects/**', '.github/workflows/projects-ci.yml']
  pull_request:
    paths: ['projects/**', '.github/workflows/projects-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-growth-pipeline
          - 02-support-agent
          - 03-rag-assistant
          - 04-qa-agent
          - 05-retention-engine
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Offline eval (RAG only)
        if: matrix.project == '03-rag-assistant'
        run: npm run eval -- --offline
      - name: Upload eval report
        if: matrix.project == '03-rag-assistant'
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: projects/03-rag-assistant/reports/
